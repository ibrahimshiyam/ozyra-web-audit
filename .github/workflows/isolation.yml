name: Isolated runner proof
on:
  push:
    paths: ['runner/**', 'scripts/isolation-proof.js', '.github/workflows/isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-none:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect existing runtime
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - name: Build script-only fixture image
        run: docker build --pull -f runner/Dockerfile -t ozyra-isolation-proof .
      - name: Prove network boundary and sandboxed controlled capture
        run: |
          mkdir -p "$RUNNER_TEMP/ozyra-isolated"
          chmod 0777 "$RUNNER_TEMP/ozyra-isolated"
          docker run --rm --init --network none --user pwuser \
            --cap-drop ALL --security-opt no-new-privileges \
            --security-opt "seccomp=$GITHUB_WORKSPACE/runner/chromium-seccomp.json" \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m --shm-size 256m \
            --memory 2g --cpus 2 --pids-limit 256 \
            --mount "type=bind,src=$RUNNER_TEMP/ozyra-isolated,dst=/out" \
            ozyra-isolation-proof sh -c 'node scripts/isolation-proof.js && node src/cli.js controlled --out /out > /out/result.json && node scripts/verify-controlled.js "$(node -p "require(\"/out/result.json\").bundle")"'
      # No capture upload, Docker socket mount, host network, sysctl or firewall changes.
